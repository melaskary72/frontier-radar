[project]
name = "frontier-radar"
version = "0.1.0"
description = "Agentic sourcing for frontier technical founders, with cited evidence and a point-in-time backtest."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "tenacity>=8.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "feedparser>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
agents = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "respx>=0.21"]

[project.scripts]
radar = "radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
