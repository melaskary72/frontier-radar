name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - name: Lint
        run: uv run ruff check radar tests eval scripts
      - name: Type check
        run: uv run mypy radar
      - name: Tests (includes leakage guard and no-em-dash rule)
        run: uv run pytest -v
