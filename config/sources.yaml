# Source configuration: endpoints, polite rate limits, and reference lists.
version: 1

rate_limits:            # minimum seconds between requests, per source
  github_search: 2.2    # search API: 30 requests per minute authenticated
  github: 0.25
  github_hourly_budget: 4000
  arxiv: 4.0            # arXiv API terms: one request every 3 seconds (429s seen at 3.1)
  semantic_scholar: 1.1 # shared unauthenticated pool: about 1 request per second
  openalex: 0.2
  hn: 0.3
  ats: 0.5
  edgar: 0.15           # SEC fair access: at most 10 requests per second
  sbir: 1.0
  usaspending: 0.5
  tranco: 1.1           # Tranco API: 1 query per second
  web: 2.0              # company homepages: gentle, and robots.txt is obeyed

endpoints:
  github_rest: https://api.github.com
  github_graphql: https://api.github.com/graphql
  arxiv: https://export.arxiv.org/api/query
  semantic_scholar: https://api.semanticscholar.org/graph/v1
  openalex: https://api.openalex.org
  hn: https://hn.algolia.com/api/v1
  greenhouse: https://boards-api.greenhouse.io/v1/boards
  lever: https://api.lever.co/v0/postings
  ashby: https://api.ashbyhq.com/posting-api/job-board
  edgar_fts: https://efts.sec.gov/LATEST/search-index
  edgar_archives: https://www.sec.gov/Archives/edgar
  edgar_data: https://data.sec.gov
  sbir: https://api.www.sbir.gov/public/api/awards
  usaspending: https://api.usaspending.gov/api/v2
  tranco: https://tranco-list.eu/api

