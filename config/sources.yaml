# Academic markers: organizations matching these are research groups, kept in the founder
# graph but left out of the default company ranking (see radar/entities/resolve.py).
academic_markers:
  words: [university, universitat, universität, université, universidad, universita, college,
          institute of technology, school of, academy of sciences, research group, research lab,
          fraunhofer, max planck, inria, cnrs, riken, csiro, national laboratory, research center,
          research centre, lab at, lab of, group at, laboratory at, laboratory of]
  # Whole tokens only. Place names companies also use (Oxford, Cambridge, Imperial) and
  # ambiguous tokens (bit, eth) are deliberately absent.
  acronyms: [mit, cmu, ucb, ucla, ucsd, uiuc, umich, gatech, ethz, epfl, tum, kaist, postech, snu,
             nus, ntu, hkust, hku, cuhk, sjtu, zju, thu, pku, ustc, hust, nju, sustech, utokyo,
             iisc, iit, kth, ucl, tsinghua, stanford, berkeley, caltech, cornell, purdue]
  domain_suffixes: [".edu", ".ac.uk", ".ac.jp", ".ac.kr", ".edu.cn", ".ac.cn", ".edu.sg", ".edu.hk", ".edu.au",
                    "ethz.ch", "epfl.ch", "tum.de", "kit.edu", "mpg.de", "fraunhofer.de", "inria.fr", "cnrs.fr",
                    "riken.jp", "csiro.au", "kaist.ac.kr"]
  # Regular expressions on the host: any .ac.xx or .edu.xx, and German uni-<city>.de hosts.
  domain_patterns: ['\.ac\.[a-z]{2}$', '\.edu\.[a-z]{2}$', '(^|\.)uni-[a-z0-9-]+\.[a-z]{2,}$']

# SEC Form D industry groups treated as in-thesis for discovery from the daily index.
form_d_industry_groups:
  - Other Technology
  - Computers
  - Telecommunications
  - Other Energy
  - Electric Utilities
  - Energy Conservation
  - Environmental Services
  - Manufacturing
  - Other

federal:
  sbir_agencies: [DOD, DOE, NASA]
  usaspending_agencies:
    - Department of Defense
    - Department of Energy
    - National Aeronautics and Space Administration
  # AFWERX awards appear as Department of the Air Force SBIR/STTR awards under DOD.
  afwerx_branch: Air Force

ats:
  providers: [greenhouse, lever, ashby]
  engineering_departments: [engineering, hardware, research, r&d, software, firmware, electrical, mechanical, robotics]
  hardware_title_terms: [hardware, mechanical, electrical, firmware, embedded, fpga, asic, rf, propulsion, avionics, manufacturing, test engineer, technician, machinist]

optional:
  x_api: {enabled: false, note: "Pluggable. Disabled without X_BEARER_TOKEN."}
  product_hunt: {enabled: false, note: "Pluggable. Disabled without PRODUCT_HUNT_TOKEN."}
