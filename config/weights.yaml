# Score weights. Total = sum over groups of weight * group score, where a group score is the
# mean of its features' 0 to 1 percentiles within (sector, as_of date). Features that are
# not observable point-in-time are dropped in backtests and the remaining group weights are
# renormalized. `make refit` proposes new weights in docs/weights-history.md and never edits
# this file.
version: 2
groups:
  technical_depth:
    weight: 0.25
    features: [paper_count, log_citations, h_index, repo_quality, hardware_code_share]
  momentum:
    weight: 0.25
    features: [fork_velocity_30d, fork_velocity_90d, external_engagement_90d, star_velocity_30d,
               contributor_growth, commit_cadence, hiring_velocity]
  founder_signal:
    weight: 0.20
    features: [left_top_lab_18m, repeat_collaborators]
  thesis_fit:
    weight: 0.15
    features: [thesis_probability]
  pre_consensus:
    weight: 0.10
    features: [no_form_d, hn_points_below_threshold]
  federal_signal:
    weight: 0.05
    features: [federal_award_present]
pre_consensus:
  hn_points_threshold: 300
