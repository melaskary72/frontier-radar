# Model routing for agents. Prices are USD per million tokens, Anthropic first-party API
# rates as published for these models (checked 2026-11-01). Cache writes are priced at
# 1.25x input and cache reads at the listed rate (Haiku 5.5 cache read assumed at 0.1x
# input; not separately listed). Haiku 5.5 prompts above 100K tokens bill at $0.50 / $2.50;
# radar/agents/cost.py applies that tier.
version: 2
spend_cap_usd: 15.0
prompt_caching: true

models:
  claude-sonnet-5-5:
    input: 2.00
    output: 10.00
    cache_read: 0.20
    cache_write: 2.50
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_read: 0.01
    cache_write: 0.125
    long_context_threshold: 100000
    long_input: 0.50
    long_output: 2.50

  # Billing reference for responses served by a server-side fallback model.
  claude-opus-5-5:
    input: 4.00
    output: 20.00
    cache_read: 0.20
    cache_write: 5.00

# Brief: latest Sonnet for research and verification, latest Haiku for triage.
roles:
  sourcing: {model: claude-haiku-5-5, effort: low, max_tokens: 1500}
  research: {model: claude-sonnet-5-5, effort: medium, max_tokens: 12000}
  verifier: {model: claude-sonnet-5-5, effort: medium, max_tokens: 8000}
  digest: {model: claude-haiku-5-5, effort: low, max_tokens: 3000}
  entity_judge: {model: claude-haiku-5-5, effort: low, max_tokens: 600}
  thesis_judge: {model: claude-haiku-5-5, effort: low, max_tokens: 600}
  analysis_rewriter: {model: claude-haiku-5-5, effort: low, max_tokens: 600}

# Server-side refusal fallback for Sonnet 5.5 (Claude API, "default" routing form).
sonnet_fallbacks: true
